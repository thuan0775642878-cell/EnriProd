<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1280, initial-scale=1.0">
    <title>EnriProd Studio - Professional Desktop DAW</title>
    <!-- Tone.js Audio Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0a0d14;
            --panel-bg: #121824;
            --panel-border: #1e293b;
            --accent-cyan: #00f2fe;
            --accent-pink: #ff0055;
            --accent-green: #00ff87;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-width: 1280px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- HEADER TRANSPORT BAR --- */
        header {
            background: #0f141f;
            border-bottom: 2px solid var(--panel-border);
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand i { color: var(--accent-cyan); text-shadow: 0 0 10px var(--accent-cyan); }
        .brand span { color: var(--accent-pink); }

        .transport-controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .lcd-display {
            background: #05070a;
            border: 1px solid #1e293b;
            border-radius: 6px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .lcd-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .lcd-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 800; }
        .lcd-value { font-size: 1.1rem; font-weight: 900; color: var(--accent-cyan); font-family: monospace; }

        .btn {
            background: #1e293b;
            color: #fff;
            border: 1px solid #334155;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.15s;
        }
        .btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-play { background: linear-gradient(135deg, #00f2fe, #0066ff); color: #000; border: none; }
        .btn-play:hover { box-shadow: 0 0 15px var(--accent-cyan); color: #000; }
        .btn-play.playing { background: linear-gradient(135deg, #ff0055, #ff5500); color: #fff; }

        input[type=number] {
            background: transparent;
            border: none;
            color: var(--accent-cyan);
            font-size: 1.1rem;
            font-weight: 900;
            width: 50px;
            text-align: center;
            font-family: monospace;
        }

        /* --- MAIN WORKSPACE GRID --- */
        main {
            display: grid;
            grid-template-columns: 2.3fr 1fr;
            gap: 16px;
            padding: 16px;
            flex-grow: 1;
            height: calc(100vh - 65px);
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .panel-header {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        /* --- SEQUENCER --- */
        .sequencer-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .track-row {
            display: grid;
            grid-template-columns: 120px repeat(16, 1fr);
            gap: 6px;
            align-items: center;
        }

        .track-info {
            background: #0f141f;
            border: 1px solid #1e293b;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .step-pad {
            aspect-ratio: 1;
            background: #182030;
            border-radius: 4px;
            border: 1px solid #28354d;
            cursor: pointer;
            transition: all 0.1s;
        }
        .step-pad:nth-child(4n+2) { border-left: 2px solid #3b82f6; }
        .step-pad.active {
            background: var(--accent-cyan);
            box-shadow: 0 0 10px var(--accent-cyan);
            border-color: #fff;
        }
        .step-pad.current { border: 2px solid var(--accent-pink); }

        /* --- PIANO KEYBOARD --- */
        .keyboard-wrapper {
            display: flex;
            height: 120px;
            position: relative;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #1e293b;
        }
        .key {
            flex: 1;
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 0 0 4px 4px;
            cursor: pointer;
            position: relative;
            z-index: 1;
        }
        .key.active, .key:active { background: var(--accent-cyan); }
        .key.black {
            background: #0f172a;
            height: 60%;
            width: 3.5%;
            position: absolute;
            z-index: 2;
            margin-left: -1.75%;
            border-radius: 0 0 4px 4px;
            border: 1px solid #334155;
        }
        .key.black.active, .key.black:active { background: var(--accent-pink); box-shadow: 0 0 10px var(--accent-pink); }

        /* --- MPC DRUM PADS --- */
        .pads-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .mpc-pad {
            aspect-ratio: 1.1;
            background: linear-gradient(145deg, #182030, #0f141f);
            border: 2px solid #28354d;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.8rem;
            color: #94a3b8;
            transition: all 0.08s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .mpc-pad:hover { border-color: var(--accent-cyan); color: #fff; }
        .mpc-pad:active, .mpc-pad.hit {
            background: var(--accent-pink);
            color: #fff;
            box-shadow: 0 0 18px var(--accent-pink);
            transform: scale(0.96);
        }

        /* --- VISUALIZER --- */
        .visualizer-box {
            height: 90px;
            background: #05070a;
            border-radius: 6px;
            border: 1px solid #1e293b;
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; }

        /* --- SYNTH CONTROLS / FX --- */
        .fx-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .fx-card {
            background: #0f14
